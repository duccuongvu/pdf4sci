[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf4sci"
version = "0.1.0"
description = "Target-size-aware PDF compressor optimized for scientific papers"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pikepdf>=8.0",
    "Pillow>=9.0",
    "typer>=0.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.0", "pdf4sci[web]", "pdf4sci[gui]"]

[project.scripts]
pdf4sci = "pdf4sci.cli:entry"
pdf4sci-web = "pdf4sci.web.app:main"
pdf4sci-gui = "pdf4sci.gui.app:main"

[tool.setuptools.packages.find]
include = ["pdf4sci*"]

[tool.setuptools.package-data]
"pdf4sci.web" = ["templates/*.html", "static/*", "static/pdfjs/*"]
