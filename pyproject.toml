[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfshrink"
version = "0.1.0"
description = "Target-size-aware PDF compressor optimized for scientific papers"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pikepdf>=8.0",
    "Pillow>=9.0",
    "typer>=0.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
dev = ["pytest>=7.0", "pdfshrink[web]"]

[project.scripts]
pdfshrink = "pdfshrink.cli:entry"
pdfshrink-web = "pdfshrink.web.app:main"

[tool.setuptools.packages.find]
include = ["pdfshrink*"]

[tool.setuptools.package-data]
"pdfshrink.web" = ["templates/*.html", "static/*", "static/pdfjs/*"]
